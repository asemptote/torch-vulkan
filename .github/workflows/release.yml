# Builds wheels for Windows and Linux (x86_64), for Termux on Android (aarch64
# and 32-bit arm) and the kernels' SPIR-V (for Termux builds from source,
# which have no slangc), tests the Linux and aarch64 Termux wheels on
# lavapipe outside the source tree, and for a v* tag attaches everything to a draft
# GitHub release. Run it by hand (workflow_dispatch) to build without
# releasing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SLANG_VERSION: "2026.20"

jobs:
  spirv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Slang
        run: |
          curl -sSLf -o slang.tar.gz "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz"
          mkdir -p "$HOME/slang" && tar -xzf slang.tar.gz -C "$HOME/slang"
          echo "SLANGC=$HOME/slang/bin/slangc" >> "$GITHUB_ENV"
      - name: Compile the kernels
        run: |
          cargo build --release -p vkcore
          # (Found wherever Cargo puts build-script outputs: Rust 1.100 moved
          # them out of target/release/build.)
          k=$(find target -path '*vkcore*' -name kernels.rs | head -1)
          test -n "$k" || { echo "vkcore's kernels.rs not found under target/"; exit 1; }
          out=$(dirname "$k")
          mkdir -p spirv && cp "$out"/*.spv spirv/
          echo "$(ls spirv | wc -l) kernels"
      - uses: actions/upload-artifact@v4
        with:
          name: spirv
          path: spirv/

  wheel-windows:
    needs: spirv
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PyTorch version (tools/torch-version)
        shell: bash
        run: echo "TORCH_VERSION=$(cat tools/torch-version)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: spirv
          path: spirv
      - name: Build the wheel
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --quiet "torch==$env:TORCH_VERSION" --index-url https://download.pytorch.org/whl/cpu
          .venv\Scripts\python -m pip install --quiet maturin
          $env:VIRTUAL_ENV = "$PWD\.venv"
          $env:VKCORE_PREBUILT_SPIRV = "$PWD\spirv"
          .venv\Scripts\maturin build --release --out dist --interpreter .venv\Scripts\python.exe
      - name: Import check
        shell: pwsh
        run: |
          python -m venv C:\t
          C:\t\Scripts\python -m pip install --quiet "torch==$env:TORCH_VERSION" --index-url https://download.pytorch.org/whl/cpu
          C:\t\Scripts\python -m pip install --quiet (Get-ChildItem dist\*.whl).FullName
          cd C:\
          C:\t\Scripts\python -c "import torch_vulkan; print('imported; GPU available:', torch_vulkan.is_available())"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/*.whl

  wheel-linux:
    needs: spirv
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: PyTorch version (tools/torch-version)
        shell: bash
        run: echo "TORCH_VERSION=$(cat tools/torch-version)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: spirv
          path: spirv
      - name: Build the wheel
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          /opt/python/cp312-cp312/bin/python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          /tmp/venv/bin/pip install --quiet maturin
          export VIRTUAL_ENV=/tmp/venv VKCORE_PREBUILT_SPIRV="$PWD/spirv"
          # libtorch comes from the installed torch package (found through the
          # $ORIGIN/../torch/lib rpath), so auditwheel must not bundle it.
          /tmp/venv/bin/maturin build --release --out dist --interpreter /tmp/venv/bin/python \
            --compatibility manylinux_2_28 --auditwheel skip
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl

  test-wheel-linux:
    needs: wheel-linux
    runs-on: ubuntu-24.04
    env:
      LP_NATIVE_VECTOR_WIDTH: "256"
    steps:
      - uses: actions/checkout@v4
      - name: PyTorch version (tools/torch-version)
        shell: bash
        run: echo "TORCH_VERSION=$(cat tools/torch-version)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux
          path: dist
      - name: lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          icd=$(dpkg -L mesa-vulkan-drivers | grep -E '/icd\.d/lvp_icd[^/]*\.json$' | head -1)
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Install the wheel and run on the GPU
        run: |
          python -m venv /tmp/t
          /tmp/t/bin/pip install --quiet "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          /tmp/t/bin/pip install --quiet dist/*.whl numpy
          cd /tmp
          /tmp/t/bin/python - <<'EOF'
          import torch, torch_vulkan
          assert torch_vulkan.is_available(), "no Vulkan device"
          assert not torch_vulkan.cpu_fallback_enabled()  # (the default: any CPU fallback raises)
          print(torch_vulkan.device_name())
          n = 64
          a = torch.randn(n, n, dtype=torch.float64, device="vk")
          a = a @ a.mT + n * torch.eye(n, dtype=torch.float64, device="vk")
          b = torch.randn(n, dtype=torch.float64, device="vk")
          r = torch.linalg.norm(a @ torch.linalg.solve(a, b) - b).item()
          s = torch.randn(100, dtype=torch.complex128, device="vk")
          f = (torch.fft.ifft(torch.fft.fft(s)) - s).abs().max().item()
          print("residual", r, "fft round trip", f)
          assert r < 1e-10 and f < 1e-12
          assert not torch_vulkan.fallback_counts()
          EOF

  # Wheels for Termux on Android, built in Termux itself: the official
  # termux-docker image on GitHub's arm64 runners (whose Neoverse N2 cores
  # also run 32-bit ARM, so the arm image runs natively too), against
  # Termux's own python-torch, from the spirv job's kernels (Termux has no
  # slangc). See docs/log/M40-termux-packages.md.
  wheel-termux:
    needs: spirv
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spirv
          path: spirv
      - name: Docker settings for Termux
        run: |
          # 32-bit bionic keeps thread IDs in 16 bits (termux-docker's README).
          sudo sysctl -w kernel.pid_max=65535
          mkdir -m 777 dist
          docker pull -q "termux/termux-docker:${{ matrix.arch }}"
          # (termux-docker needs the personality() syscall)
          echo "TERMUX_RUN=docker run --rm --security-opt seccomp=unconfined -v $PWD:/src:ro -v $PWD/spirv:/spirv:ro -v $PWD/dist:/out termux/termux-docker:${{ matrix.arch }}" >> "$GITHUB_ENV"
      - name: Build the wheel in Termux
        run: $TERMUX_RUN bash /src/tools/termux_ci.sh build /spirv /out
      - name: Test the wheel in a fresh Termux (lavapipe)
        run: $TERMUX_RUN bash /src/tools/termux_ci.sh test /out
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-termux-${{ matrix.arch }}
          path: dist/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [spirv, wheel-windows, wheel-linux, test-wheel-linux, wheel-termux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: PyTorch version (tools/torch-version)
        shell: bash
        run: echo "TORCH_VERSION=$(cat tools/torch-version)" >> "$GITHUB_ENV"
      - name: The tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject.toml $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: spirv
          path: spirv
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "dist/torch-vulkan-spirv-${GITHUB_REF_NAME}.tar.gz" -C spirv .
          cat > notes.md <<EOF
          Wheels for Windows and Linux (x86_64), for Python 3.11 or newer and PyTorch ${TORCH_VERSION%.*}:

              pip install "torch==${TORCH_VERSION%.*}.*"
              pip install <wheel URL from the assets below>

          On Android (Termux), wheels for 64-bit (aarch64) and 32-bit (armeabi_v7a)
          userspaces, compiled against Termux's python-torch ${TORCH_VERSION} (and
          refusing to import under another torch, so reinstall after a python-torch
          upgrade); \`pkg install vulkan-loader-android\` lets them reach the phone's GPU:

              pkg install python-torch vulkan-loader-android
              pip install <android_24_arm64_v8a or android_24_armeabi_v7a wheel URL from the assets below>

          The aarch64 wheel is tested on lavapipe (Mesa's CPU Vulkan) in Termux's
          Docker image, the arm wheel on an Arm Mali-G57 phone. With another
          python-torch, build from source with the prebuilt kernels: extract
          torch-vulkan-spirv-${GITHUB_REF_NAME}.tar.gz and run
          \`tools/build-termux.sh <that directory>\` (see the README).
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "torch-vulkan ${GITHUB_REF_NAME}" --notes-file notes.md dist/*
