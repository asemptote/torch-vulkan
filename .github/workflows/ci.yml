# Builds torch-vulkan on Linux and runs every test on lavapipe, Mesa's CPU
# implementation of Vulkan, with the validation layer on.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE*", "NOTICE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE*", "NOTICE"]

# A newer push to the same PR supersedes a running check. On main a running
# check finishes (only a queued one is replaced by the newest), so a busy day
# of pushes still produces finished results.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SLANG_VERSION: "2026.20"
  # The validation layer of the Vulkan SDK used in development: Ubuntu's
  # 1.3.275 reports false positives (storagePushConstant8/16 for push
  # constants that only hold buffer pointers) and best-practices warnings the
  # current layer no longer raises.
  VVL_SDK: "1.4.363.0"
  VVL_SDK_SHA256: 197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43
  TORCH_VK_VALIDATE: "1"
  # lavapipe's LLVM JIT emits AVX-512 code that faults on some runner CPUs.
  LP_NATIVE_VECTOR_WIDTH: "256"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: vvl-cache
        with:
          path: ~/vvl
          key: vvl-${{ env.VVL_SDK }}

      - name: Validation layer (from the Vulkan SDK)
        if: steps.vvl-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSLf -o sdk.tar.xz "https://sdk.lunarg.com/sdk/download/${VVL_SDK}/linux/vulkansdk-linux-x86_64-${VVL_SDK}.tar.xz"
          echo "${VVL_SDK_SHA256}  sdk.tar.xz" | sha256sum -c -
          mkdir -p ~/vvl
          tar -xJf sdk.tar.xz -C ~/vvl --strip-components=2 --wildcards \
            "*/x86_64/lib/libVkLayer_khronos_validation.so" \
            "*/x86_64/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json"
          rm sdk.tar.xz

      # The Mesa and Vulkan packages, kept so a run doesn't depend on Ubuntu's
      # archive being reachable (the runners lost DNS for it for hours once).
      # Keyed by the runner image, whose other packages they must match
      # (ImageOS and ImageVersion are the runner's shell variables).
      - name: Runner image
        run: echo "RUNNER_IMAGE=$ImageOS-$ImageVersion" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        id: apt-debs
        with:
          path: ~/apt-debs
          key: apt-debs-${{ env.RUNNER_IMAGE }}-v1

      - name: Vulkan (lavapipe, loader, validation layer)
        run: |
          if [ "${{ steps.apt-debs.outputs.cache-hit }}" = "true" ] && sudo dpkg -i ~/apt-debs/*.deb; then
            echo "Mesa and Vulkan tools installed from the cache"
          else
            mkdir -p ~/apt-debs/partial
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 -o Dir::Cache::archives="$HOME/apt-debs" \
              -o APT::Keep-Downloaded-Packages=true install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
            sudo chown -R "$(id -u):$(id -g)" ~/apt-debs
            rm -rf ~/apt-debs/partial ~/apt-debs/lock
            ls ~/apt-debs
          fi
          echo "VK_ADD_LAYER_PATH=$HOME/vvl/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/vvl/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          # Use lavapipe even if the runner exposes another Vulkan driver. The
          # manifest's name varies between Mesa releases, so ask the package.
          icd=$(dpkg -L mesa-vulkan-drivers | grep -E '/icd\.d/lvp_icd[^/]*\.json$' | head -1)
          test -n "$icd" || { echo "lavapipe manifest not found"; dpkg -L mesa-vulkan-drivers | grep icd.d; exit 1; }
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES=$icd vulkaninfo --summary
          VK_ADD_LAYER_PATH=$HOME/vvl/share/vulkan/explicit_layer.d LD_LIBRARY_PATH=$HOME/vvl/lib \
            vulkaninfo --summary | grep -A3 -i "VK_LAYER_KHRONOS_validation"

      - name: Slang
        run: |
          curl -sSL -o slang.tar.gz "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz"
          mkdir -p "$HOME/slang" && tar -xzf slang.tar.gz -C "$HOME/slang"
          echo "SLANGC=$HOME/slang/bin/slangc" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Compiled dependencies and the workspace crates' build outputs: the
      # build scripts keep SPIR-V and the C++ objects in OUT_DIR, keyed by
      # content hash, so an unchanged kernel or .cpp file is not rebuilt.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: "true"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python environment
        run: |
          python -m venv .venv
          # The PyTorch the backend is developed against: tests compare with the
          # CPU's results, which change between releases (2.15's float16 linspace).
          .venv/bin/pip install --quiet "torch==$(cat tools/torch-version)" --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python tools/check_torch_version.py
          .venv/bin/pip install --quiet numpy pytest maturin expecttest hypothesis
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Rust tests and lint
        run: |
          cargo clippy --release --all-targets -- -D warnings
          cargo test --release -p vkcore

      - name: Build the extension
        run: maturin develop --release

      - name: Python tests
        run: python -m pytest -q

      # vk raises the CPU's dtype errors itself, from a generated table; this
      # fails if the installed PyTorch's CPU no longer gives those errors.
      - name: The CPU dtype-error table still matches the CPU
        run: python tools/dev/cpu_dtype_errors.py --check

      - name: Op coverage sweep
        run: |
          set -o pipefail
          python tools/opinfo_coverage.py --jobs 4 --strict | tail -50
        env:
          TORCH_VK_VALIDATE: "0"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opinfo-coverage
          path: tools/opinfo_coverage.json
