[package]
name = "vkcore"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Vulkan compute core for a PyTorch backend: device, memory, pipelines, dispatch"

[features]
# Kernels in shaders/test, used only by this crate's tests and examples.
test-kernels = []

[dependencies]
ash = "0.38"

[dev-dependencies]
# Tests and examples see the test kernels.
vkcore = { path = ".", features = ["test-kernels"] }
